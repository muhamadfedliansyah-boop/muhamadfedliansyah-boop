name: Realtime PageSpeed Insights Updater

on:
  schedule:
    - cron: '0 0 * * *' # Updates daily
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_pagespeed.js'

jobs:
  update-pagespeed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Fetch Realtime PageSpeed & Update SVG
        run: node scripts/update_pagespeed.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/pagespeed.svg
          git commit -m "chore: update realtime PageSpeed metrics [skip ci]" || exit 0
          git push
